<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Town</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <header class="header">
            <i class="fas fa-cloud-sun logo-icon"></i>
            <h1>Weather Town</h1>
        </header>

        <div class="search-section">
            <div class="search-box">
                <i class="fas fa-search search-icon"></i>
                <input type="text" id="cityInput" placeholder="Search city..." autocomplete="off">
                <button id="searchBtn">Search</button>
            </div>
            <button id="locationBtn" class="location-btn" title="Use My Location">
                <i class="fas fa-location-crosshairs"></i>
            </button>
        </div>

        <div id="loader" class="loader hidden">
            <div class="spinner"></div>
            <p>Loading weather data...</p>
        </div>

        <div id="errorMessage" class="error-message hidden">
            <p id="errorText">City not found.</p>
        </div>

        <main id="weatherCard" class="weather-card hidden">
            <div class="current-weather">
                <div class="weather-info">
                    <h2 id="cityName">--</h2>
                    <p id="dateTime" class="date-text">--</p>
                    <div class="temp-wrapper">
                        <span id="temperature" class="temp-main">--</span>
                        <span class="temp-unit">°C</span>
                    </div>
                    <p id="description" class="weather-desc">--</p>
                </div>
                <div class="weather-visual">
                    <img id="weatherIcon" src="" alt="Weather condition">
                    <p>Feels like <span id="feelsLike">--</span>°C</p>
                </div>
            </div>

            <div class="weather-metrics">
                <div class="metric">
                    <i class="fas fa-droplet"></i>
                    <div>
                        <span id="humidity" class="metric-val">--%</span>
                        <span class="metric-label">Humidity</span>
                    </div>
                </div>
                <div class="metric">
                    <i class="fas fa-wind"></i>
                    <div>
                        <span id="windSpeed" class="metric-val">-- km/h</span>
                        <span class="metric-label">Wind</span>
                    </div>
                </div>
                <div class="metric">
                    <i class="fas fa-eye"></i>
                    <div>
                        <span id="visibility" class="metric-val">-- km</span>
                        <span class="metric-label">Visibility</span>
                    </div>
                </div>
                <div class="metric">
                    <i class="fas fa-gauge-high"></i>
                    <div>
                        <span id="pressure" class="metric-val">-- hPa</span>
                        <span class="metric-label">Pressure</span>
                    </div>
                </div>
            </div>
        </main>

        <section id="forecastSection" class="forecast-section hidden">
            <h3>5-Day Forecast</h3>
            <div id="forecastContainer" class="forecast-grid"></div>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
