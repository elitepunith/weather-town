<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Town</title>
    <meta name="description" content="Current weather and forecasts for any city.">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⛅</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="bg-scene">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <div class="page" id="page">

        <div class="top-section" id="topSection">

            <header class="brand">
                <span class="brand-icon">⛅</span>
                <div class="brand-words">
                    <h1 class="brand-name">Weather Town</h1>
                    <p class="brand-sub">Real-time weather, anywhere</p>
                </div>
            </header>

            <div class="search-wrap">
                <button class="locate-btn" id="locationBtn" aria-label="Use my location">
                    <svg viewBox="0 0 22 22" fill="none">
                        <circle cx="11" cy="11" r="3.5" stroke="currentColor" stroke-width="1.8"/>
                        <path d="M11 2.5v2.2M11 17.3v2.2M2.5 11h2.2M17.3 11h2.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                    </svg>
                </button>
                <div class="search-box">
                    <svg class="search-ico" viewBox="0 0 20 20" fill="none">
                        <circle cx="9" cy="9" r="5.5" stroke="currentColor" stroke-width="1.7"/>
                        <path d="M13.5 13.5l3.2 3.2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
                    </svg>
                    <input
                        id="cityInput"
                        type="text"
                        placeholder="Search a city…"
                        autocomplete="off"
                        spellcheck="false"
                    >
                </div>
                <button class="go-btn" id="searchBtn">Search</button>
            </div>

            <div class="feedback">
                <div id="loader" class="loader hidden">
                    <span class="spin"></span>
                    <span>Fetching weather…</span>
                </div>
                <div id="errorBox" class="error-box hidden">
                    <svg viewBox="0 0 20 20" fill="none">
                        <circle cx="10" cy="10" r="7.5" stroke="currentColor" stroke-width="1.6"/>
                        <path d="M10 6.5v3.5M10 12.5v.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                    </svg>
                    <span id="errorText">City not found.</span>
                </div>
            </div>

        </div>

        <main id="results" class="results hidden">

            <div class="hero-card glass-card">
                <div class="hero-inner">
                    <div class="hero-meta">
                        <h2 id="cityName" class="city-name">—</h2>
                        <p id="description" class="sky-desc">—</p>
                    </div>
                    <div class="hero-temp">
                        <img id="weatherIcon" class="wx-icon" src="" alt="">
                        <div class="temp-display">
                            <span id="temperature">—</span><sup>°</sup>
                        </div>
                    </div>
                    <div class="hero-footer">
                        <span class="hero-chip">
                            <svg viewBox="0 0 16 16" fill="none"><path d="M8 2a2 2 0 0 1 2 2v5.35a3 3 0 1 1-4 0V4a2 2 0 0 1 2-2z" stroke="currentColor" stroke-width="1.4"/></svg>
                            Feels <strong id="feelsLike">—</strong>°
                        </span>
                        <span class="hero-chip">
                            <svg class="chip-arrow" viewBox="0 0 12 12" fill="none"><path d="M6 10V2M2 6l4-4 4 4" stroke="#f97316" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
                            <strong id="tempHigh">—</strong>°
                            <span class="chip-dot">·</span>
                            <svg class="chip-arrow" viewBox="0 0 12 12" fill="none"><path d="M6 2v8M2 6l4 4 4-4" stroke="#60a5fa" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
                            <strong id="tempLow">—</strong>°
                        </span>
                    </div>
                </div>
            </div>

            <div class="stats-row">
                <div class="stat-card glass-card">
                    <div class="stat-icon blue">
                        <svg viewBox="0 0 20 20" fill="currentColor"><path d="M10 2a1 1 0 0 0-1 1v7.27a3 3 0 1 0 2 0V3a1 1 0 0 0-1-1z"/></svg>
                    </div>
                    <span class="stat-val" id="humidity">—</span>
                    <span class="stat-lbl">Humidity</span>
                </div>
                <div class="stat-card glass-card">
                    <div class="stat-icon cyan">
                        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M3 7h9a2 2 0 1 0 0-4H3M3 10h12a2 2 0 1 1 0 4H3"/></svg>
                    </div>
                    <span class="stat-val" id="windSpeed">—</span>
                    <span class="stat-lbl">Wind</span>
                </div>
                <div class="stat-card glass-card">
                    <div class="stat-icon violet">
                        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><ellipse cx="10" cy="10" rx="9" ry="5.5"/><circle cx="10" cy="10" r="2.5"/></svg>
                    </div>
                    <span class="stat-val" id="visibility">—</span>
                    <span class="stat-lbl">Visibility</span>
                </div>
                <div class="stat-card glass-card">
                    <div class="stat-icon amber">
                        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="10" cy="10" r="7.5"/><path d="M10 6v4l2.5 2"/></svg>
                    </div>
                    <span class="stat-val" id="pressure">—</span>
                    <span class="stat-lbl">Pressure</span>
                </div>
            </div>

            <div class="forecast-card glass-card">
                <p class="forecast-heading">5-Day Forecast</p>
                <div class="forecast-track" id="forecastContainer"></div>
            </div>

        </main>

    </div>

    <script src="script.js"></script>
</body>
</html>
