<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Town</title>
    <meta name="description" content="Check current weather and 5-day forecast for any city.">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌤</text></svg>">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="mesh-bg"></div>

    <div class="page-wrapper">
        <div class="brand-header">
            <div class="brand-logo">⛅</div>
            <div class="brand-text">
                <h1 class="brand-name">Weather Town</h1>
                <p class="brand-tagline">Real-time weather, anywhere</p>
            </div>
        </div>

        <main class="app-widget">
        <header class="search-bar">
            <button id="locationBtn" class="icon-btn" aria-label="Use current location">
                <i class="fas fa-location-arrow"></i>
            </button>
            <div class="input-wrapper">
                <i class="fas fa-search"></i>
                <input type="text" id="cityInput" placeholder="Search city..." autocomplete="off">
            </div>
            <button id="searchBtn" class="search-trigger">Search</button>
        </header>

        <div id="loader" class="status-msg hidden">
            <div class="spinner"></div>
            <p>Loading...</p>
        </div>

        <div id="errorMessage" class="status-msg error hidden">
            <p id="errorText">City not found.</p>
        </div>

        <article id="weatherCard" class="weather-content hidden">

            <!-- ── Hero: city + temp + icon ── -->
            <div class="hero-section">
                <div class="hero-left">
                    <h2 id="cityName" class="city-name">--</h2>
                    <p id="description" class="condition">--</p>
                    <div class="temp-row">
                        <span id="temperature" class="temp-display">--</span>
                        <span class="temp-deg">°</span>
                    </div>
                    <div class="hero-sub-row">
                        <span class="feels-badge">
                            <i class="fas fa-thermometer-half"></i>
                            Feels like <strong id="feelsLike">--</strong>°
                        </span>
                    </div>
                </div>
                <div class="hero-right">
                    <img id="weatherIcon" class="weather-icon" src="" alt="">
                    <div class="hi-lo">
                        <span class="hi-lo-item">
                            <i class="fas fa-arrow-up"></i>
                            <span id="tempHigh">--</span>°
                        </span>
                        <span class="hi-lo-sep">·</span>
                        <span class="hi-lo-item lo">
                            <i class="fas fa-arrow-down"></i>
                            <span id="tempLow">--</span>°
                        </span>
                    </div>
                </div>
            </div>

            <!-- ── Metrics 2×2 ── -->
            <div class="metrics-grid">
                <div class="metric-box">
                    <div class="metric-icon-wrap blue">
                        <i class="fas fa-droplet"></i>
                    </div>
                    <span id="humidity" class="val">--%</span>
                    <span class="label">Humidity</span>
                </div>
                <div class="metric-box">
                    <div class="metric-icon-wrap teal">
                        <i class="fas fa-wind"></i>
                    </div>
                    <span id="windSpeed" class="val">-- km/h</span>
                    <span class="label">Wind</span>
                </div>
                <div class="metric-box">
                    <div class="metric-icon-wrap purple">
                        <i class="fas fa-eye"></i>
                    </div>
                    <span id="visibility" class="val">-- km</span>
                    <span class="label">Visibility</span>
                </div>
                <div class="metric-box">
                    <div class="metric-icon-wrap amber">
                        <i class="fas fa-gauge"></i>
                    </div>
                    <span id="pressure" class="val">-- hPa</span>
                    <span class="label">Pressure</span>
                </div>
            </div>

            <!-- ── 5-day forecast ── -->
            <div class="forecast-section">
                <p class="forecast-label">5-Day Forecast</p>
                <div id="forecastSection" class="forecast-scroller">
                    <div id="forecastContainer" class="forecast-track"></div>
                </div>
            </div>

        </article>

        <footer class="app-footer">
            <p>Weather Town</p>
        </footer>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
