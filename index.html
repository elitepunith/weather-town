<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Town</title>
    <meta name="description" content="Current weather and forecasts for any city.">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⛅</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="bg-scene">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
        <div class="orb orb-4"></div>
    </div>

    <!-- ═══════════ HOME SCREEN ═══════════ -->
    <div class="home-screen" id="homeScreen">

        <header class="brand">
            <div class="brand-icon-wrap">
                <span class="brand-emoji">⛅</span>
            </div>
            <div class="brand-text">
                <h1 class="brand-name">Weather Town</h1>
                <p class="brand-sub">Real-time weather, anywhere</p>
            </div>
        </header>

        <div class="search-row">
            <button class="locate-btn" id="locationBtn" aria-label="Use my location" title="Use my location">
                <svg viewBox="0 0 22 22" fill="none">
                    <circle cx="11" cy="11" r="3.5" stroke="currentColor" stroke-width="1.8"/>
                    <path d="M11 2.5v2.2M11 17.3v2.2M2.5 11h2.2M17.3 11h2.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                </svg>
            </button>
            <div class="search-field">
                <svg class="search-ico" viewBox="0 0 20 20" fill="none">
                    <circle cx="9" cy="9" r="5.5" stroke="currentColor" stroke-width="1.8"/>
                    <path d="M13.5 13.5l3.2 3.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                </svg>
                <input id="cityInput" type="text" placeholder="Search a city…" autocomplete="off" spellcheck="false">
            </div>
            <button class="search-btn" id="searchBtn">Search</button>
        </div>

        <div class="home-status">
            <div id="homeLoader" class="status-loader hidden">
                <span class="spinner"></span>
                <span>Fetching weather…</span>
            </div>
            <div id="homeError" class="status-error hidden">
                <svg viewBox="0 0 20 20" fill="none">
                    <circle cx="10" cy="10" r="7.5" stroke="currentColor" stroke-width="1.6"/>
                    <path d="M10 6.5v3.5M10 12.5v.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                </svg>
                <span id="homeErrorText">City not found.</span>
            </div>
        </div>

    </div>

    <!-- ═══════════ RESULTS SCREEN ═══════════ -->
    <div class="results-screen hidden" id="resultsScreen">

        <nav class="topbar">
            <div class="topbar-logo">
                <span class="topbar-emoji">⛅</span>
                <span class="topbar-name">Weather Town</span>
            </div>
            <div class="search-row compact">
                <button class="locate-btn sm" id="locationBtnR" aria-label="Use my location">
                    <svg viewBox="0 0 22 22" fill="none">
                        <circle cx="11" cy="11" r="3.5" stroke="currentColor" stroke-width="1.8"/>
                        <path d="M11 2.5v2.2M11 17.3v2.2M2.5 11h2.2M17.3 11h2.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                    </svg>
                </button>
                <div class="search-field sm">
                    <svg class="search-ico" viewBox="0 0 20 20" fill="none">
                        <circle cx="9" cy="9" r="5.5" stroke="currentColor" stroke-width="1.8"/>
                        <path d="M13.5 13.5l3.2 3.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                    </svg>
                    <input id="cityInputR" type="text" placeholder="Search another city…" autocomplete="off" spellcheck="false">
                </div>
                <button class="search-btn sm" id="searchBtnR">Search</button>
            </div>
        </nav>

        <div id="resultsError" class="topbar-error hidden">
            <svg viewBox="0 0 20 20" fill="none">
                <circle cx="10" cy="10" r="7.5" stroke="currentColor" stroke-width="1.6"/>
                <path d="M10 6.5v3.5M10 12.5v.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            </svg>
            <span id="resultsErrorText">City not found.</span>
        </div>

        <main class="dashboard">

            <!-- LEFT: hero -->
            <div class="dash-left">
                <div class="hero-card glass-card">
                    <div class="hero-glow"></div>

                    <div class="hero-head">
                        <div class="hero-location">
                            <h2 id="cityName" class="city-name">—</h2>
                            <p id="localTime" class="local-time">—</p>
                            <p id="description" class="sky-desc">—</p>
                        </div>
                        <img id="weatherIcon" class="wx-icon" src="" alt="">
                    </div>

                    <div class="big-temp">
                        <span id="temperature">—</span><sup>°C</sup>
                    </div>

                    <div class="hero-pills">
                        <span class="pill">
                            <svg viewBox="0 0 14 14" fill="none">
                                <path d="M7 1.5a1.75 1.75 0 0 1 1.75 1.75v4.7a3 3 0 1 1-3.5 0V3.25A1.75 1.75 0 0 1 7 1.5z" stroke="currentColor" stroke-width="1.3"/>
                            </svg>
                            Feels <strong id="feelsLike">—</strong>°
                        </span>
                        <span class="pill">
                            <svg viewBox="0 0 12 12" fill="none">
                                <path d="M6 9.5V2.5M3 5.5l3-3 3 3" stroke="#fb923c" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                            <strong id="tempHigh">—</strong>°
                            <span class="pill-dot">·</span>
                            <svg viewBox="0 0 12 12" fill="none">
                                <path d="M6 2.5v7M3 6.5l3 3 3-3" stroke="#60a5fa" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                            <strong id="tempLow">—</strong>°
                        </span>
                    </div>
                </div>
            </div>

            <!-- RIGHT: stats + forecast -->
            <div class="dash-right">

                <div class="stats-grid">
                    <div class="stat-card glass-card">
                        <div class="stat-icon blue">
                            <svg viewBox="0 0 20 20" fill="currentColor"><path d="M10 2a1 1 0 0 0-1 1v7.27a3 3 0 1 0 2 0V3a1 1 0 0 0-1-1z"/></svg>
                        </div>
                        <span class="stat-val" id="humidity">—</span>
                        <span class="stat-label">Humidity</span>
                    </div>
                    <div class="stat-card glass-card">
                        <div class="stat-icon cyan">
                            <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
                                <path d="M3 7h9a2 2 0 1 0 0-4H3M3 10.5h11a2 2 0 1 1 0 4H3"/>
                            </svg>
                        </div>
                        <span class="stat-val" id="windSpeed">—</span>
                        <span class="stat-label" id="windDir">Wind</span>
                    </div>
                    <div class="stat-card glass-card">
                        <div class="stat-icon violet">
                            <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
                                <ellipse cx="10" cy="10" rx="9" ry="5.5"/><circle cx="10" cy="10" r="2.5"/>
                            </svg>
                        </div>
                        <span class="stat-val" id="visibility">—</span>
                        <span class="stat-label">Visibility</span>
                    </div>
                    <div class="stat-card glass-card">
                        <div class="stat-icon amber">
                            <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
                                <circle cx="10" cy="10" r="7.5"/><path d="M10 6v4l2.5 2"/>
                            </svg>
                        </div>
                        <span class="stat-val" id="pressure">—</span>
                        <span class="stat-label">Pressure</span>
                    </div>
                    <div class="stat-card glass-card">
                        <div class="stat-icon rose">
                            <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
                                <circle cx="10" cy="6" r="3"/><path d="M5.5 17c0-2.485 2.015-4.5 4.5-4.5s4.5 2.015 4.5 4.5"/>
                                <path d="M10 3V1M10 11v2M3 6H1M5.2 3.2L3.8 1.8"/>
                            </svg>
                        </div>
                        <span class="stat-val" id="sunrise">—</span>
                        <span class="stat-label">Sunrise</span>
                    </div>
                    <div class="stat-card glass-card">
                        <div class="stat-icon indigo">
                            <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
                                <path d="M17.5 13A7.5 7.5 0 0 1 6.5 2.5 7.5 7.5 0 1 0 17.5 13z"/>
                            </svg>
                        </div>
                        <span class="stat-val" id="sunset">—</span>
                        <span class="stat-label">Sunset</span>
                    </div>
                </div>

                <div class="forecast-card glass-card">
                    <div class="forecast-header">
                        <p class="forecast-label">5-Day Forecast</p>
                        <p class="forecast-updated" id="lastUpdated">—</p>
                    </div>
                    <div class="forecast-row" id="forecastContainer"></div>
                </div>

            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
