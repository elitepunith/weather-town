<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Town</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="mesh-bg"></div>
    <main class="app-widget">
        <header class="search-bar">
            <button id="locationBtn" class="icon-btn" aria-label="Current Location">
                <i class="fas fa-location-arrow"></i>
            </button>
            <div class="input-wrapper">
                <i class="fas fa-search"></i>
                <input type="text" id="cityInput" placeholder="Search city..." autocomplete="off">
            </div>
            <button id="searchBtn" class="search-trigger">Search</button>
        </header>

        <div id="loader" class="status-msg hidden">
            <div class="spinner"></div>
            <p>Loading...</p>
        </div>

        <div id="errorMessage" class="status-msg error hidden">
            <p id="errorText">City not found.</p>
        </div>

        <article id="weatherCard" class="weather-content hidden">
            <div class="main-temp-section">
                <h2 id="cityName">--</h2>
                <p id="description" class="condition">--</p>
                <div class="temp-display">
                    <span id="temperature">--</span>°
                </div>
                <p class="high-low">Feels like <span id="feelsLike">--</span>°</p>
            </div>

            <div class="metrics-grid">
                <div class="metric-box">
                    <i class="fas fa-droplet"></i>
                    <span id="humidity" class="val">--%</span>
                    <span class="label">Humidity</span>
                </div>
                <div class="metric-box">
                    <i class="fas fa-wind"></i>
                    <span id="windSpeed" class="val">-- km/h</span>
                    <span class="label">Wind</span>
                </div>
                <div class="metric-box">
                    <i class="fas fa-eye"></i>
                    <span id="visibility" class="val">-- km</span>
                    <span class="label">Visibility</span>
                </div>
                <div class="metric-box">
                    <i class="fas fa-gauge"></i>
                    <span id="pressure" class="val">-- hPa</span>
                    <span class="label">Pressure</span>
                </div>
            </div>

            <div id="forecastSection" class="forecast-scroller">
                <div id="forecastContainer" class="forecast-track">
                    </div>
            </div>
        </article>
    </main>

    <script src="script.js"></script>
</body>
</html>
