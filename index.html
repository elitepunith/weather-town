<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Town</title>
    <meta name="description" content="Check current weather and 5-day forecast for any city.">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌤</text></svg>">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="mesh-bg"></div>

    <div class="page-wrapper" id="pageWrapper">

        <!-- Brand — above everything -->
        <div class="brand-header">
            <div class="brand-logo">⛅</div>
            <div class="brand-text">
                <h1 class="brand-name">Weather Town</h1>
                <p class="brand-tagline">Real-time weather, anywhere</p>
            </div>
        </div>

        <!-- Search bar -->
        <div class="search-shell">
            <button id="locationBtn" class="icon-btn" aria-label="Use current location">
                <i class="fas fa-location-crosshairs"></i>
            </button>
            <div class="input-wrapper">
                <i class="fas fa-magnifying-glass"></i>
                <input type="text" id="cityInput" placeholder="Search city..." autocomplete="off">
            </div>
            <button id="searchBtn" class="search-trigger">Search</button>
        </div>

        <!-- Loader -->
        <div id="loader" class="status-msg hidden">
            <div class="spinner"></div>
            <p>Loading...</p>
        </div>

        <!-- Error -->
        <div id="errorMessage" class="status-msg error hidden">
            <p id="errorText">City not found.</p>
        </div>

        <!-- Results — horizontal grid -->
        <div id="weatherCard" class="results-grid hidden">

            <!-- LEFT col: hero temp -->
            <div class="result-hero glass-card">
                <div class="hero-top">
                    <div class="hero-city">
                        <h2 id="cityName" class="city-name">--</h2>
                        <p id="description" class="condition">--</p>
                    </div>
                    <img id="weatherIcon" class="weather-icon" src="" alt="">
                </div>

                <div class="big-temp">
                    <span id="temperature">--</span><sup>°</sup>
                </div>

                <div class="hero-pills">
                    <span class="pill feels-pill">
                        <i class="fas fa-temperature-half"></i>
                        Feels like <strong id="feelsLike">--</strong>°
                    </span>
                    <span class="pill hilo-pill">
                        <i class="fas fa-arrow-up hi-icon"></i>
                        <span id="tempHigh">--</span>°
                        <span class="sep">·</span>
                        <i class="fas fa-arrow-down lo-icon"></i>
                        <span id="tempLow">--</span>°
                    </span>
                </div>
            </div>

            <!-- RIGHT col: 2×2 metric cards -->
            <div class="result-metrics">
                <div class="metric-box glass-card">
                    <div class="metric-icon-wrap blue"><i class="fas fa-droplet"></i></div>
                    <span id="humidity" class="val">--%</span>
                    <span class="label">Humidity</span>
                </div>
                <div class="metric-box glass-card">
                    <div class="metric-icon-wrap teal"><i class="fas fa-wind"></i></div>
                    <span id="windSpeed" class="val">--</span>
                    <span class="label">Wind</span>
                </div>
                <div class="metric-box glass-card">
                    <div class="metric-icon-wrap purple"><i class="fas fa-eye"></i></div>
                    <span id="visibility" class="val">--</span>
                    <span class="label">Visibility</span>
                </div>
                <div class="metric-box glass-card">
                    <div class="metric-icon-wrap amber"><i class="fas fa-gauge-high"></i></div>
                    <span id="pressure" class="val">--</span>
                    <span class="label">Pressure</span>
                </div>
            </div>

            <!-- FULL WIDTH bottom: forecast -->
            <div class="result-forecast glass-card">
                <p class="forecast-label">5-Day Forecast</p>
                <div class="forecast-track" id="forecastContainer"></div>
            </div>

        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
